# ---------------------------------------------------------------------------
# E.V.I.E.'s brains. This file is the swap table -- edit it, not the code.
#
# Two kinds:
#
#   kind: cli     Runs a command. Authenticated by a SUBSCRIPTION you already
#                 pay for (or a free tier), so requests cost nothing extra.
#                 These carry a full agent loop: files, shell, web, MCP.
#                 They can do the work, not just talk about it.
#
#   kind: openai  POSTs to anything speaking the OpenAI chat schema. Fast and
#                 nearly free, but no tools. Good for questions.
#
# Switch at any time by voice ("Evie, switch to Gemini"), by CLI
# (`evie brains use gemini`), or automatically when one runs out of quota.
# ---------------------------------------------------------------------------

# Conversation goes to the fastest free brain; work escalates to one with
# hands. Measured on real hardware: `claude -p` takes 5-11s to first token
# because every call boots a whole Claude Code session, while Groq answers in
# well under a second. Defaulting to Claude meant paying that wait -- and plan
# allowance -- for "what time is it".
#
# The router sends anything task-shaped (open, read, write, organize, check my
# ...) to an agentic brain regardless of this setting, so you lose nothing.
default: groq

# How hard is this, and who should handle it. The router scores each request
# and picks the matching tier; a tier whose brain is unconfigured falls to the
# next one down, so you never have to keep this in sync with your API keys.
tiers:
  simple:  groq        # greetings, short factual questions, one-liners
  normal:  groq        # ordinary conversation and explanations
  hard:    claude      # analysis, comparison, planning, writing at length
  agentic: claude      # anything that touches files, the shell or MCP tools

# Tried in order when a brain is rate limited or down. Unconfigured brains are
# skipped automatically -- no key, no attempt -- so this list can name more
# than you have set up.
fallback:
  - groq
  - gemini_api
  - openrouter
  - github
  - claude
  - ollama_cloud
  - ollama

brains:

  # --- subscription-backed CLIs (no per-request cost) ---------------------

  claude:
    kind: cli
    agentic: true
    parser: claude_stream_json   # parses --output-format stream-json
    resume_flag: --resume        # keeps her native session across turns
    cwd: ~/EVIE/vault            # so file tools land in the vault
    command:
      - claude
      - -p
      - "{prompt}"
      - --output-format
      - stream-json
      - --include-partial-messages
      - --verbose
      - --permission-mode
      - acceptEdits
    aliases: [claude, anthropic, sonnet, opus]

  codex:
    kind: cli
    agentic: true
    parser: plain
    enabled: false               # flip to true once `codex` is installed + logged in
    cwd: ~/EVIE/vault
    command: [codex, exec, "{prompt}"]
    aliases: [codex, chatgpt, gpt, openai]

  gemini_cli:
    kind: cli
    agentic: true
    parser: plain
    daily_limit: 1000            # free tier, roughly
    cwd: ~/EVIE/vault
    command: [gemini, -p, "{prompt}"]
    aliases: [gemini, google, gemini cli]

  # --- HTTP brains (free tiers and local) ---------------------------------

  groq:
    kind: openai
    base_url: https://api.groq.com/openai/v1
    model: openai/gpt-oss-120b
    api_key_env: GROQ_API_KEY    # free key from console.groq.com
    daily_limit: 1000
    aliases: [groq, fast, quick, speedy]

  gemini_api:
    kind: openai
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-2.5-flash
    # Key from aistudio.google.com/apikey. New keys start AQ.Ab (Google moved
    # off the older AIza format in May 2026 and is retiring it); both work.
    api_key_env: GEMINI_API_KEY
    daily_limit: 1500
    aliases: [gemini api, flash]

  github:
    kind: openai
    base_url: https://models.github.ai/inference
    model: openai/gpt-4o         # check the catalog; model ids change
    api_key_env: GITHUB_TOKEN
    aliases: [github, copilot, github models]

  openrouter:
    kind: openai
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-chat-v3.1:free
    api_key_env: OPENROUTER_API_KEY
    aliases: [openrouter, router]

  # Ollama, hosted. An API key from ollama.com/settings/keys, no download.
  # Free tier is for light use; past that it bills GPU time, not tokens.
  ollama_cloud:
    kind: openai
    base_url: https://ollama.com/v1
    model: gpt-oss:120b-cloud    # also deepseek-v3.1:671b-cloud, qwen3-coder:480b-cloud
    api_key_env: OLLAMA_API_KEY
    aliases: [ollama cloud, cloud, hosted ollama]

  # Ollama, on your own machine. The only brain that works with no internet,
  # and the only one with no limit of any kind -- but it needs the download.
  ollama:
    kind: openai
    base_url: http://localhost:11434/v1
    model: qwen3:8b              # `ollama pull qwen3:8b` first
    enabled: false               # off until you install it
    aliases: [local, offline, on device]

  # --- always available, needs nothing ------------------------------------

  echo:
    kind: echo
    # On by default, and never in `fallback` above: it needs no account, no
    # key and no network, so `evie ask "hi" --brain echo` is the one command
    # that proves your install works before any credential is involved.
    aliases: [echo, test, parrot]

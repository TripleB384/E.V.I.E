# E.V.I.E. settings. Copied to ~/.evie/config.yaml by `evie init`.

# Hold this key to talk. alt_r is Right Option on a Mac -- close to your thumb
# and used by nothing else. Others: alt_l, cmd_r, ctrl_r, f13.
hotkey: alt_r

# Phase 5. Leave empty for push-to-talk only, which is what actually works.
wake_word: ""

# Memory lives here. Point it at an Obsidian vault if you already keep one.
vault: ~/EVIE/vault
identity_file: EVIE.md

# How many turns of conversation she carries. Higher costs tokens on every
# request; lower makes her forget what you just said.
transcript_turns: 12

voice:
  tts: kokoro           # kokoro | say | elevenlabs | null
  kokoro_voice: af_heart
  speed: 1.0
  elevenlabs_voice_id: ""

ears:
  model: small.en       # tiny.en is faster; small.en is much better at names
  compute_type: int8
  language: en

# Canvas LMS. Deadlines are synced into the vault as markdown by
# `evie canvas sync`, so the fast free brain can answer "what's due Thursday"
# without booting a Claude Code session to do it.
#
# base_url is your district's Canvas host and nothing more -- no /login, no
# course path. The token is NOT here: generate one in a browser at
# Account -> Settings -> "+ New Access Token" and put it in your shell:
#     export CANVAS_API_TOKEN='...'
# A Canvas token is password-equivalent and is shown exactly once.
canvas:
  base_url: ""                    # e.g. https://yourdistrict.instructure.com
  token_env: CANVAS_API_TOKEN
  days_back: 7                    # keep recently-missed work visible
  days_ahead: 60
  # Re-sync when the vault copy is older than this, so a deadline posted
  # this morning is hers by the afternoon. 0 keeps it manual.
  refresh_hours: 6

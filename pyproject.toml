[project]
name = "evie"
version = "0.1.0"
description = "A voice-first personal assistant with swappable AI brains"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-2.0-only" }

# Core deps stay small and pure-Python so the brain layer can be
# installed and tested anywhere, including headless CI.
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "rich>=13.7",
    "click>=8.1",
]

[project.optional-dependencies]
# Everything that needs a microphone, speakers, or a model download.
voice = [
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "soundfile>=0.12",
    "faster-whisper>=1.0",
    "kokoro-onnx>=0.4",
    "pynput>=1.7",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
evie = "evie.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evie"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
